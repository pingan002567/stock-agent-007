<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Stock Agent</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .box { text-align: center; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 16px;
    border: 3px solid #2a2e3a; border-top-color: #5b8cff;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #8a8f9c; font-size: 13px; margin-top: 10px; min-height: 20px; }
  code { color: #b7c4e0; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div>正在连接 Stock Agent 后端…</div>
    <div class="hint" id="hint"></div>
  </div>
<script>
  // Phase 0：后端由 ./start.sh 手动启动；本页仅探活后跳转。
  // no-cors 探测：后端可达时 fetch resolve（opaque），连接拒绝时 reject——
  // 不需要后端加 CORS 头。跳转本身不受同源策略限制。
  const BACKEND = "http://127.0.0.1:6666";
  const started = Date.now();
  const hint = document.getElementById("hint");

  async function probe() {
    try {
      await fetch(BACKEND + "/api/health", { mode: "no-cors", cache: "no-store" });
      window.location.replace(BACKEND + "/");
    } catch (_) {
      if (Date.now() - started > 8000) {
        hint.innerHTML = "后端未启动？请在项目目录运行 <code>./start.sh</code>";
      }
      setTimeout(probe, 800);
    }
  }
  probe();
</script>
</body>
</html>
