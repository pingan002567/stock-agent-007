<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Stock Agent</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .box { text-align: center; width: 420px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 16px;
    border: 3px solid #2a2e3a; border-top-color: #5b8cff;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #8a8f9c; font-size: 13px; margin-top: 10px; min-height: 20px; }
  code, .mono { font-family: ui-monospace, Menlo, monospace; color: #b7c4e0; font-size: 12px; }
  .gate { display: none; text-align: left; }
  .gate.active { display: block; }
  .gate h2 { font-size: 16px; margin: 0 0 14px; text-align: center; }
  .check { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .check .mark { width: 16px; text-align: center; }
  .check.ok .mark { color: #4caf7d; }
  .check.bad .mark { color: #e05a5a; }
  .check.bad { color: #e6b0b0; }
  label { display: block; font-size: 12px; color: #8a8f9c; margin: 16px 0 6px; }
  input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 8px 10px;
    background: #171a21; border: 1px solid #2a2e3a; border-radius: 7px;
    color: #e6e6e6; font-size: 13px; font-family: ui-monospace, Menlo, monospace;
  }
  button {
    margin-top: 16px; width: 100%; padding: 9px 0;
    background: #5b8cff; color: #fff; border: none; border-radius: 7px;
    font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: transparent; border: 1px solid #2a2e3a; color: #8a8f9c; margin-top: 8px; }
  .err { color: #e05a5a; font-size: 12px; margin-top: 10px; white-space: pre-wrap; word-break: break-all; }

  /* 首启向导 */
  .step-dots { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 4px 0 18px; }
  .step-dot {
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    font: 600 11px/1 ui-monospace, Menlo, monospace;
    color: #8a8f9c; border: 1px solid #2a2e3a; background: #171a21;
  }
  .step-dot.on { color: #fff; background: #5b8cff; border-color: #5b8cff; }
  .step-dot.done { color: #5b8cff; border-color: #5b8cff; }
  .step-line { width: 34px; height: 1px; background: #2a2e3a; }
  .setup-step { display: none; }
  .setup-step.on { display: block; animation: stepin .2s ease both; }
  @keyframes stepin { from { opacity: 0; transform: translateX(8px); } }
  .step-desc { font-size: 12.5px; color: #8a8f9c; line-height: 1.6; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 8px; margin-top: 16px; }
  .btn-row button { margin-top: 0; }
  .btn-row .ghost { width: 90px; flex: none; }
  .browse-row { display: flex; gap: 8px; }
  .browse-row input { flex: 1; }
  .browse-row .ghost { width: 74px; flex: none; margin-top: 0; padding: 0; }
  .field-hint { font-size: 11px; color: #565f73; margin-top: 6px; min-height: 15px; }
  .confirm-box { border: 1px solid #2a2e3a; border-radius: 10px; padding: 4px 12px; }
  .confirm-row {
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 12px; color: #8a8f9c; padding: 8px 0;
  }
  .confirm-row + .confirm-row { border-top: 1px solid #1d212b; }
  .confirm-row .mono { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <div class="box">
    <!-- 探活/过渡态 -->
    <div id="gate-splash" class="gate active" style="text-align:center">
      <div class="spinner"></div>
      <div id="splash-text">正在连接 Stock Agent 后端…</div>
      <div class="hint" id="splash-hint"></div>
    </div>

    <!-- 首启向导：环境检测 → 工作目录 → 注册启动（doc/DESKTOP_APP_PLAN.md §3.1 闸门式串行） -->
    <div id="gate-setup" class="gate">
      <h2>初始化 Stock Agent</h2>
      <div class="step-dots">
        <span class="step-dot" data-step="1">1</span><span class="step-line"></span
        ><span class="step-dot" data-step="2">2</span><span class="step-line"></span
        ><span class="step-dot" data-step="3">3</span>
      </div>

      <!-- 步骤 1：环境检测 -->
      <div class="setup-step" data-step="1">
        <div class="step-desc">欢迎使用 Stock Agent。先确认运行环境就绪：</div>
        <div id="checklist"></div>
        <div class="btn-row">
          <button id="step1Next">继续</button>
        </div>
      </div>

      <!-- 步骤 2：工作目录 -->
      <div class="setup-step" data-step="2">
        <div class="step-desc">
          选择工作目录——行情缓存、会话记录、生成的报告都会存放在这里。
          默认位置即可，也可以选到 iCloud/移动硬盘等自定义位置。
        </div>
        <label for="dataDir">工作目录</label>
        <div class="browse-row">
          <input type="text" id="dataDir" spellcheck="false" />
          <button class="ghost" id="browseBtn" type="button">浏览…</button>
        </div>
        <div class="field-hint" id="dirHint"></div>
        <div class="btn-row">
          <button class="ghost" data-back="1">上一步</button>
          <button id="step2Next">继续</button>
        </div>
      </div>

      <!-- 步骤 3：确认并启动 -->
      <div class="setup-step" data-step="3">
        <div class="step-desc">确认无误后注册后台服务。服务由系统守护（launchd），
          开机自启、崩溃自动拉起，之后打开应用即直接进入。</div>
        <div class="confirm-box">
          <div class="confirm-row"><span>工作目录</span><span class="mono" id="confirmDir"></span></div>
          <div class="confirm-row"><span>服务端口</span><span class="mono">自动分配（默认 8686）</span></div>
          <div class="confirm-row"><span>开机自启</span><span class="mono">是（launchd KeepAlive）</span></div>
        </div>
        <div class="btn-row">
          <button class="ghost" data-back="2">上一步</button>
          <button id="installBtn">注册后台服务并启动</button>
        </div>
        <div class="err" id="setupErr"></div>
      </div>
    </div>

    <!-- 修复向导：自愈失败才出现（§3.1.4 多层自愈，UI 只在失败时打断） -->
    <div id="gate-repair" class="gate">
      <h2>服务未响应</h2>
      <div class="hint" style="text-align:left">
        后台服务已注册但探活失败。日志：<br/>
        <span class="mono" id="logPath"></span>
      </div>
      <button id="retryBtn">重启服务重试</button>
      <button id="resetBtn" class="ghost">强制重置（重新注册服务）</button>
      <div class="err" id="repairErr"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  function showGate(name) {
    for (const g of document.querySelectorAll(".gate")) g.classList.remove("active");
    $("gate-" + name).classList.add("active");
  }

  async function cli(...args) { return await invoke("service_cli", { args }); }

  // no-cors 探测：后端可达时 resolve（opaque），连接拒绝时 reject——无需后端 CORS 头
  async function probe(port) {
    try {
      await fetch(`http://127.0.0.1:${port}/api/health`, { mode: "no-cors", cache: "no-store" });
      return true;
    } catch (_) { return false; }
  }

  async function enter(port) {
    localStorage.setItem("sa.lastGoodPort", String(port));
    const url = `http://127.0.0.1:${port}/`;
    // WKWebView 拦截 tauri://→http:// 的 JS 顶层跳转（静默失败），优先走 Rust 原生导航
    if (invoke) {
      try { await invoke("navigate", { url }); return; } catch (_) { /* fall through */ }
    }
    window.location.replace(url);
  }

  const CHECK_LABELS = [
    ["platform_ok", "macOS 平台"],
    ["venv_python_exists", "Python 运行时（.venv）"],
    ["frontend_dist_exists", "前端产物（frontend/dist）"],
    ["data_dir_writable", "数据目录可写"],
  ];
  function renderChecklist(d) {
    $("checklist").innerHTML = CHECK_LABELS.map(([key, label]) => {
      const ok = !!d[key];
      return `<div class="check ${ok ? "ok" : "bad"}"><span class="mark">${ok ? "✓" : "✗"}</span>${label}</div>`;
    }).join("");
    // 关键项（平台/运行时/前端产物）不满足时不放行；目录可写在第 2 步自选后由服务端校验
    $("step1Next").disabled = !(d.platform_ok && d.venv_python_exists && d.frontend_dist_exists);
  }

  // ── 首启向导：闸门式串行（§3.1） ──
  let defaultDataDir = "";
  function showStep(n) {
    document.querySelectorAll(".setup-step").forEach((s) =>
      s.classList.toggle("on", Number(s.dataset.step) === n));
    document.querySelectorAll(".step-dot").forEach((dot) => {
      const k = Number(dot.dataset.step);
      dot.classList.toggle("on", k === n);
      dot.classList.toggle("done", k < n);
    });
    if (n === 3) $("confirmDir").textContent = $("dataDir").value.trim();
  }
  function openSetup(d) {
    renderChecklist(d);
    defaultDataDir = d.data_dir || "";
    if (!$("dataDir").value) $("dataDir").value = defaultDataDir;
    $("dirHint").textContent = `默认：${defaultDataDir}`;
    showGate("setup");
    showStep(1);
  }
  $("step1Next").addEventListener("click", () => showStep(2));
  $("step2Next").addEventListener("click", () => {
    if (!$("dataDir").value.trim()) { $("dirHint").textContent = "请填写或选择一个目录"; return; }
    showStep(3);
  });
  document.querySelectorAll("[data-back]").forEach((b) =>
    b.addEventListener("click", () => showStep(Number(b.dataset.back))));

  // 原生目录选择（tauri-plugin-dialog）；不可用时隐藏浏览按钮，退回手输
  const dialogOpen = window.__TAURI__ && window.__TAURI__.dialog && window.__TAURI__.dialog.open;
  if (!dialogOpen) $("browseBtn").style.display = "none";
  $("browseBtn").addEventListener("click", async () => {
    try {
      const picked = await dialogOpen({ directory: true, defaultPath: $("dataDir").value.trim() || defaultDataDir, title: "选择 Stock Agent 工作目录" });
      if (picked) $("dataDir").value = picked;
    } catch (e) { $("dirHint").textContent = String(e); }
  });

  async function waitHealthy(port, rounds = 24) {
    for (let i = 0; i < rounds; i++) {
      if (await probe(port)) return true;
      await new Promise((r) => setTimeout(r, 500));
    }
    return false;
  }

  // 浏览器直开 ui/index.html（无 Tauri）时退回阶段 0 行为：探活 6666 循环
  async function legacyLoop() {
    const started = Date.now();
    (async function tick() {
      if (await probe(6666)) return enter(6666);
      if (Date.now() - started > 8000)
        $("splash-hint").innerHTML = "后端未启动？请在项目目录运行 <code>./start.sh</code>";
      setTimeout(tick, 800);
    })();
  }

  async function boot() {
    // 快路径（§3.1.1 冷启动跳过冷 probe）：上次成功端口直接探活
    const last = Number(localStorage.getItem("sa.lastGoodPort"));
    if (last && (await probe(last))) return enter(last);
    if (!invoke) {
      $("splash-hint").textContent = "（浏览器模式：等待 6666 后端）";
      return legacyLoop();
    }

    $("splash-hint").textContent = "正在检测环境（doctor）…";
    let d;
    try { d = await cli("doctor"); }
    catch (e) { $("splash-hint").textContent = "doctor 失败: " + String(e); return; }
    $("splash-hint").textContent = "";

    if (d.backend_healthy) {
      // 服务端探活通过还不够：端口必须对 webview 可达（6666 这类端口在
      // WebKit/Chromium 受限名单里，服务健康但页面永远打不开）。不可达走
      // 修复向导，强制重置后重装会自动选可用端口。
      if (await probe(d.port)) return enter(d.port);
      $("logPath").textContent = `端口 ${d.port} 对应用视图不可达（可能是浏览器引擎受限端口）`;
      showGate("repair");
      return;
    }

    if (!d.service_installed) {
      openSetup(d); // 首启向导：检测 → 工作目录 → 注册
      return;
    }

    // 已安装但不健康 → 自愈：kickstart -k + 轮询，失败才打断（§3.1.4）
    $("splash-text").textContent = "服务未响应，正在重启…";
    try {
      const r = await cli("restart");
      if (r.ok && r.backend_healthy) return enter(r.port);
    } catch (_) { /* fallthrough to repair */ }
    $("logPath").textContent = (d.state_dir || "") + "/logs/backend.err.log";
    showGate("repair");
  }

  $("installBtn").addEventListener("click", async () => {
    const btn = $("installBtn");
    btn.disabled = true;
    btn.textContent = "正在注册并启动…";
    $("setupErr").textContent = "";
    const started = Date.now();
    try {
      const r = await cli("install", "--data-dir", $("dataDir").value.trim());
      // 安装动作 padding ~2.5s，防止 checklist "闪一下"（§3.1.1）
      const elapsed = Date.now() - started;
      if (elapsed < 2500) await new Promise((res) => setTimeout(res, 2500 - elapsed));
      if (r.ok && r.backend_healthy) return enter(r.port);
      if (r.ok && (await waitHealthy(r.port))) return enter(r.port);
      $("setupErr").textContent = r.error || "服务已注册但探活超时，请查看日志后重试";
    } catch (e) {
      $("setupErr").textContent = String(e);
    }
    btn.disabled = false;
    btn.textContent = "注册后台服务并启动";
  });

  $("retryBtn").addEventListener("click", async () => {
    $("repairErr").textContent = "";
    try {
      const r = await cli("restart");
      if (r.ok && r.backend_healthy) return enter(r.port);
      $("repairErr").textContent = r.error || "重启后仍未通过健康检查";
    } catch (e) { $("repairErr").textContent = String(e); }
  });

  $("resetBtn").addEventListener("click", async () => {
    $("repairErr").textContent = "";
    try {
      await cli("uninstall");
      const d = await cli("doctor");
      openSetup(d);
    } catch (e) { $("repairErr").textContent = String(e); }
  });

  boot();
</script>
</body>
</html>
