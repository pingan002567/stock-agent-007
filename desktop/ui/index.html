<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Stock Agent</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e6e6e6;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .box { text-align: center; width: 420px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 16px;
    border: 3px solid #2a2e3a; border-top-color: #5b8cff;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #8a8f9c; font-size: 13px; margin-top: 10px; min-height: 20px; }
  code, .mono { font-family: ui-monospace, Menlo, monospace; color: #b7c4e0; font-size: 12px; }
  .gate { display: none; text-align: left; }
  .gate.active { display: block; }
  .gate h2 { font-size: 16px; margin: 0 0 14px; text-align: center; }
  .check { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; }
  .check .mark { width: 16px; text-align: center; }
  .check.ok .mark { color: #4caf7d; }
  .check.bad .mark { color: #e05a5a; }
  .check.bad { color: #e6b0b0; }
  label { display: block; font-size: 12px; color: #8a8f9c; margin: 16px 0 6px; }
  input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 8px 10px;
    background: #171a21; border: 1px solid #2a2e3a; border-radius: 7px;
    color: #e6e6e6; font-size: 13px; font-family: ui-monospace, Menlo, monospace;
  }
  button {
    margin-top: 16px; width: 100%; padding: 9px 0;
    background: #5b8cff; color: #fff; border: none; border-radius: 7px;
    font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: transparent; border: 1px solid #2a2e3a; color: #8a8f9c; margin-top: 8px; }
  .err { color: #e05a5a; font-size: 12px; margin-top: 10px; white-space: pre-wrap; word-break: break-all; }

  /* 首启欢迎页：单屏，唯一决定 = 工作目录 */
  .welcome { text-align: center; }
  .welcome-logo {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(180deg, #171b26, #0b0d13);
    box-shadow: 0 0 28px rgba(91,140,255,.30), inset 0 0 0 1px rgba(255,255,255,.06);
    display: grid; place-items: center;
  }
  .welcome h1 { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
  .welcome-sub { font-size: 12.5px; color: #8a8f9c; line-height: 1.7; margin: 0 auto 22px; max-width: 340px; }
  .dir-row {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: #171a21; border: 1px solid #2a2e3a; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 14px;
  }
  .dir-ico { flex: none; color: #8a8f9c; display: grid; }
  .dir-info { flex: 1; min-width: 0; }
  .dir-label { font-size: 11px; color: #565f73; margin-bottom: 2px; }
  .dir-path {
    font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #b7c4e0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; unicode-bidi: plaintext; text-align: left; /* 头部省略且不重排斜杠 */
  }
  .dir-change {
    flex: none; margin: 0; width: auto; padding: 5px 12px;
    background: transparent; border: 1px solid #2a2e3a; border-radius: 7px;
    color: #8a8f9c; font-size: 12px;
  }
  .dir-change:hover { color: #e6e6e6; border-color: #3a4152; }
  .env-err {
    text-align: left; font-size: 12.5px; color: #e6b0b0;
    background: rgba(224,90,90,.08); border: 1px solid rgba(224,90,90,.3);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
  }
  .env-err .mono { color: #d8b4b4; }
</style>
</head>
<body>
  <div data-tauri-drag-region style="position:fixed;top:0;left:0;right:0;height:28px;z-index:50"></div>
  <div class="box">
    <!-- 探活/过渡态 -->
    <div id="gate-splash" class="gate active" style="text-align:center">
      <div class="spinner"></div>
      <div id="splash-text">正在连接 Stock Agent 后端…</div>
      <div class="hint" id="splash-hint"></div>
    </div>

    <!-- 首启欢迎页：环境检查静默（失败才显示），唯一决定 = 工作目录 -->
    <div id="gate-setup" class="gate welcome">
      <div class="welcome-logo">
        <svg width="40" height="40" viewBox="0 0 100 100">
          <defs><linearGradient id="wl" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#3a6aec"/><stop offset="1" stop-color="#89a8ff"/>
          </linearGradient></defs>
          <g opacity=".62">
            <rect x="26" y="60" width="9" height="18" rx="2.5" fill="#4aa07a"/>
            <rect x="41" y="65" width="9" height="13" rx="2.5" fill="#cc5c5c"/>
            <rect x="56" y="55" width="9" height="23" rx="2.5" fill="#4aa07a"/>
          </g>
          <polyline points="18,72 42,55 53,61 74,32" fill="none" stroke="url(#wl)"
            stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="74" cy="32" r="8.5" fill="#89a8ff"/><circle cx="74" cy="32" r="4.6" fill="#f0f6ff"/>
        </svg>
      </div>
      <h1>欢迎使用 Stock Agent</h1>
      <p class="welcome-sub">AI 驱动的个人投资工作台。数据完全存储在本机，选择一个工作目录即可开始。</p>

      <div class="env-err" id="envErr" style="display:none"></div>

      <div class="dir-row">
        <span class="dir-ico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span class="dir-info">
          <span class="dir-label">工作目录</span>
          <div class="dir-path" id="dirPath"></div>
        </span>
        <button class="dir-change" id="browseBtn" type="button">更改…</button>
      </div>

      <button id="installBtn">开始使用</button>
      <div class="err" id="setupErr"></div>
    </div>

    <!-- 修复向导：自愈失败才出现（§3.1.4 多层自愈，UI 只在失败时打断） -->
    <div id="gate-repair" class="gate">
      <h2>服务未响应</h2>
      <div class="hint" style="text-align:left">
        后台服务已注册但探活失败。日志：<br/>
        <span class="mono" id="logPath"></span>
      </div>
      <button id="retryBtn">重启服务重试</button>
      <button id="resetBtn" class="ghost">强制重置（重新注册服务）</button>
      <div class="err" id="repairErr"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  function showGate(name) {
    for (const g of document.querySelectorAll(".gate")) g.classList.remove("active");
    $("gate-" + name).classList.add("active");
  }

  async function cli(...args) { return await invoke("service_cli", { args }); }

  // no-cors 探测：后端可达时 resolve（opaque），连接拒绝时 reject——无需后端 CORS 头
  async function probe(port) {
    try {
      await fetch(`http://127.0.0.1:${port}/api/health`, { mode: "no-cors", cache: "no-store" });
      return true;
    } catch (_) { return false; }
  }

  async function enter(port) {
    localStorage.setItem("sa.lastGoodPort", String(port));
    const url = `http://127.0.0.1:${port}/?_=${Date.now()}`;
    // WKWebView 拦截 tauri://→http:// 的 JS 顶层跳转（静默失败），优先走 Rust 原生导航
    if (invoke) {
      try { await invoke("navigate", { url }); return; } catch (_) { /* fall through */ }
    }
    window.location.replace(url);
  }

  // ── 首启欢迎页：环境检查静默，失败才显示；唯一决定 = 工作目录 ──
  const ENV_LABELS = {
    platform_ok: "仅支持 macOS",
    venv_python_exists: "缺少 Python 运行时（请先运行 ./install.sh）",
    frontend_dist_exists: "缺少前端产物（请先运行 cd frontend && npm run build）",
  };
  let chosenDir = "";
  function openSetup(d) {
    chosenDir = chosenDir || d.data_dir || "";
    $("dirPath").textContent = chosenDir;
    // 环境问题静默检查：全部就绪不打扰，有缺失才显示并禁用入口
    const problems = Object.keys(ENV_LABELS).filter((k) => !d[k]);
    $("envErr").style.display = problems.length ? "block" : "none";
    $("envErr").innerHTML = problems.map((k) => `· ${ENV_LABELS[k]}`).join("<br/>");
    $("installBtn").disabled = problems.length > 0;
    showGate("setup");
  }

  // 原生目录选择（tauri-plugin-dialog）；不可用时隐藏更改按钮，使用默认目录
  const dialogOpen = window.__TAURI__ && window.__TAURI__.dialog && window.__TAURI__.dialog.open;
  if (!dialogOpen) $("browseBtn").style.display = "none";
  $("browseBtn").addEventListener("click", async () => {
    try {
      const picked = await dialogOpen({ directory: true, defaultPath: chosenDir, title: "选择 Stock Agent 工作目录" });
      if (picked) { chosenDir = picked; $("dirPath").textContent = picked; }
    } catch (e) { $("setupErr").textContent = String(e); }
  });

  async function waitHealthy(port, rounds = 24) {
    for (let i = 0; i < rounds; i++) {
      if (await probe(port)) return true;
      await new Promise((r) => setTimeout(r, 500));
    }
    return false;
  }

  const DEFAULT_PORT = 8686;
  // 浏览器直开 ui/index.html（无 Tauri）时仅用于调试引导页，正式入口为 Tauri 桌面
  async function legacyLoop() {
    const started = Date.now();
    (async function tick() {
      if (await probe(DEFAULT_PORT)) return enter(DEFAULT_PORT);
      if (Date.now() - started > 8000)
        $("splash-hint").innerHTML = "后端未启动？请在项目目录运行 <code>./start.sh</code>";
      setTimeout(tick, 800);
    })();
  }

  async function boot() {
    // 快路径（§3.1.1 冷启动跳过冷 probe）：上次成功端口直接探活
    const last = Number(localStorage.getItem("sa.lastGoodPort"));
    if (last && (await probe(last))) return enter(last);
    if (!invoke) {
      $("splash-hint").textContent = "（调试模式：等待 8686 后端，请用 Tauri 桌面打开）";
      return legacyLoop();
    }

    $("splash-hint").textContent = "正在检测环境（doctor）…";
    let d;
    try { d = await cli("doctor"); }
    catch (e) { $("splash-hint").textContent = "doctor 失败: " + String(e); return; }
    $("splash-hint").textContent = "";

    if (d.backend_healthy) {
      // 服务端探活通过还不够：端口必须对 webview 可达（6666 这类端口在
      // WebKit/Chromium 受限名单里，服务健康但页面永远打不开）。不可达走
      // 修复向导，强制重置后重装会自动选可用端口。
      if (await probe(d.port)) return enter(d.port);
      $("logPath").textContent = `端口 ${d.port} 对应用视图不可达（可能是浏览器引擎受限端口）`;
      showGate("repair");
      return;
    }

    if (!d.service_installed) {
      openSetup(d); // 首启向导：检测 → 工作目录 → 注册
      return;
    }

    // 已安装但不健康 → 自愈：kickstart -k + 轮询，失败才打断（§3.1.4）
    $("splash-text").textContent = "服务未响应，正在重启…";
    try {
      const r = await cli("restart");
      if (r.ok && r.backend_healthy) return enter(r.port);
    } catch (_) { /* fallthrough to repair */ }
    $("logPath").textContent = (d.state_dir || "") + "/logs/backend.err.log";
    showGate("repair");
  }

  $("installBtn").addEventListener("click", async () => {
    const btn = $("installBtn");
    btn.disabled = true;
    btn.textContent = "正在初始化…";
    $("setupErr").textContent = "";
    try {
      const r = await cli("install", "--data-dir", chosenDir);
      if (r.ok && r.backend_healthy) return enter(r.port);
      if (r.ok && (await waitHealthy(r.port))) return enter(r.port);
      $("setupErr").textContent = r.error || "服务已注册但未响应，请重试";
    } catch (e) {
      $("setupErr").textContent = String(e);
    }
    btn.disabled = false;
    btn.textContent = "开始使用";
  });

  $("retryBtn").addEventListener("click", async () => {
    $("repairErr").textContent = "";
    try {
      const r = await cli("restart");
      if (r.ok && r.backend_healthy) return enter(r.port);
      $("repairErr").textContent = r.error || "重启后仍未通过健康检查";
    } catch (e) { $("repairErr").textContent = String(e); }
  });

  $("resetBtn").addEventListener("click", async () => {
    $("repairErr").textContent = "";
    try {
      await cli("uninstall");
      const d = await cli("doctor");
      openSetup(d);
    } catch (e) { $("repairErr").textContent = String(e); }
  });

  boot();
</script>
</body>
</html>
