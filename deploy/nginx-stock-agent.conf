# HTTPS reverse proxy in front of uvicorn (127.0.0.1:8086).
# Certs: /etc/nginx/certs/stock-agent.{crt,key}
# Listen 443 (when SG allows) and 8686 (current public port) so iOS can use HTTPS
# without waiting for a new security-group rule.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host:8686$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8686 ssl http2;
    listen [::]:8686 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/stock-agent.crt;
    ssl_certificate_key /etc/nginx/certs/stock-agent.key;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
